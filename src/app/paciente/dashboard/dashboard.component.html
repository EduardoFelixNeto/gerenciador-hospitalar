<div class="container">
  <h2>Bem-vindo!</h2>
  <p>Saldo de Pontos: <strong>{{ dashboardData!.saldoPontos }}</strong></p>
  <button mat-stroked-button color="accent" (click)="abrirDialogCompra()">Comprar Pontos</button>
  <button mat-stroked-button color="primary" (click)="abrirDialogAgendamento()">Agendar Consulta</button>


  <mat-tab-group>
    <mat-tab label="Futuros">
      <app-agendamento-lista [agendamentos]="getAgendamentosPorStatus('CRIADO')"
                             (cancelar)="cancelarAgendamento($event)"
                             (checkin)="realizarCheckin($event)"></app-agendamento-lista>
    </mat-tab>
    <mat-tab label="Realizados">
      <app-agendamento-lista [agendamentos]="getAgendamentosPorStatus('REALIZADO')"></app-agendamento-lista>
    </mat-tab>
    <mat-tab label="Cancelados">
      <app-agendamento-lista [agendamentos]="getAgendamentosPorStatus('CANCELADO')"></app-agendamento-lista>
    </mat-tab>
  </mat-tab-group>
</div>
